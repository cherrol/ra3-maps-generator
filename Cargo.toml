[package]
name = "ra3maps"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust Red Alert 3 map workshop"
publish = false

[[example]]
name = "test-data"
path = "tools/test_data.rs"
test = true

[[example]]
name = "maintenance"
path = "tools/maintenance.rs"
test = true

[[example]]
name = "henan-authoring"
path = "tools/henan_authoring.rs"

[[example]]
name = "henan-spawns"
path = "tools/henan_spawns.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
flate2 = "1.1.5"
crc32fast = "1.5.0"
chrono = "0.4.42"
fontdue = "0.9.3"

[profile.release]
lto = "thin"
strip = true

[profile.test]
opt-level = 2

