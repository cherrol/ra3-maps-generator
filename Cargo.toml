[package]
name = "ra3maps"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Native Rust Red Alert 3 map workshop"
publish = false

[[example]]
name = "test-data"
path = "xtask/test_data.rs"
test = true

[[example]]
name = "maintenance"
path = "xtask/maintenance.rs"
test = true

[[example]]
name = "preview-water-layers"
path = "xtask/preview_water_layers.rs"
test = true

[[example]]
name = "preview-acceptance"
path = "xtask/preview_acceptance.rs"
test = true

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
flate2 = "1.1.5"
crc32fast = "1.5.0"
chrono = "0.4.42"
fontdue = "0.9.3"

[profile.release]
lto = "thin"
strip = true

[profile.test]
opt-level = 2


[[example]]
name = "preview-intrusion-repair"
path = "xtask/preview_intrusion_repair.rs"
test = true

[[example]]
name = "preview-source-reference"
path = "xtask/preview_source_reference.rs"
test = true

[[example]]
name = "import-ea-catalog"
path = "xtask/import_ea_catalog.rs"
test = true

[[example]]
name = "verify-official-maps"
path = "xtask/verify_official_maps.rs"
test = true

[[example]]
name = "verify-preview-intrusion-repair"
path = "xtask/verify_preview_intrusion_repair.rs"
test = true

[[example]]
name = "extract-player-scripts"
path = "xtask/extract_player_scripts.rs"

# Stable iterative-authoring profile; do not toggle release LTO mid-task.
[profile.authoring]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
